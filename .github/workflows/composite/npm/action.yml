name: 'NPM'
description: 'Installs NPM deps'

inputs:
  registry:
    description: 'NPM registry'
    default: 'https://registry.npmjs.org'
    required: false
  scope:
    description: 'NPM scope'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        registry-url: ${{ inputs.registry }}
        scope: ${{ inputs.scope }}

    # Dependabot writes lock files with npm 11; npm 10 (bundled with Node 22)
    # rejects them in `npm ci`, so match the lock file's writer.
    - name: Set npm
      shell: bash
      run: npm i -g npm@11.21.1

    - name: Install deps in quiet mode
      shell: bash
      run: npm ci -q
      env:
        NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
