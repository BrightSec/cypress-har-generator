name: CI / Automated testing

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        uses: ./.github/workflows/composite/npm

  build-and-test:
    runs-on: ubuntu-latest
    needs: install-deps
    strategy:
      fail-fast: false
      matrix:
        target: ['lint', 'format', 'build', 'test']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        uses: ./.github/workflows/composite/npm

      - name: Execute ${{ matrix.target }} npm script
        run: npm run ${{ matrix.target }}

  # `default` is the Cypress version the repository depends on; 15.10 is the earliest version the plugin supports
  # the `lifecycle` suite records a HAR for each spec, which the default suite turns off to test the commands
  e2e:
    name: e2e (cypress ${{ matrix.cypress }}${{ matrix.suite == 'lifecycle' && ', lifecycle' || '' }})
    runs-on: ubuntu-latest
    needs: install-deps
    strategy:
      fail-fast: false
      matrix:
        cypress: ['default', '15.10']
        suite: ['default']
        include:
          - cypress: 'default'
            suite: 'lifecycle'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        uses: ./.github/workflows/composite/npm

      - name: Install Cypress ${{ matrix.cypress }}
        if: ${{ matrix.cypress != 'default' }}
        run: npm i --no-save cypress@${{ matrix.cypress }}

      - name: Execute e2e npm script
        uses: cypress-io/github-action@v7
        timeout-minutes: 10
        with:
          install: false
          wait-on: 'http://localhost:8080/'
          wait-on-timeout: 120
          start: npm start
          browser: chrome
          config-file: ${{ matrix.suite == 'lifecycle' && 'cypress.lifecycle.config.ts' || 'cypress.config.ts' }}
          record: ${{ matrix.cypress == 'default' && matrix.suite == 'default' && github.repository == 'BrightSec/cypress-har-generator' }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
