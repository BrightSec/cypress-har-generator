name: Automated deploy

on:
  release:
    types: [created]

env:
  VERSION: ${{ github.event.release.tag_name }}
  TARGET_REF: ${{ github.event.release.target_commitish }}

jobs:
  dist-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # a maintenance release (e.g. from 4.x or 4.2.x) goes to `latest-4` so it does not move `latest`
      - id: resolve
        run: |
          if [ "$TARGET_REF" = master ]; then tag=latest; else tag="latest-${TARGET_REF%%.*}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  install-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - name: Install deps
        uses: ./.github/workflows/composite/npm

  build:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - name: Install deps
        uses: ./.github/workflows/composite/npm

      - name: Build package
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            package.json
            package-lock.json
            README.md
            LICENSE

  publish-to-npm:
    runs-on: ubuntu-latest
    needs: [build, dist-tag]
    env:
      TAG: ${{ needs.dist-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Install deps
        uses: ./.github/workflows/composite/npm

      - name: Publish package to NPM
        run: npm publish --tag $TAG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-to-gpr:
    runs-on: ubuntu-latest
    needs: [build, dist-tag]
    env:
      TAG: ${{ needs.dist-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Install deps
        uses: ./.github/workflows/composite/npm
        with:
          registry: 'https://npm.pkg.github.com'
          scope: '@brightsec'

      - name: Publish package to GPR
        run: |
          npm pkg set name=@brightsec/cypress-har-generator
          npm publish --tag $TAG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_TOKEN }}
