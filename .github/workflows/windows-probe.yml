# Temporary: checks self-deleting temp files on Windows. Removed before merge.
name: windows-probe
on:
  push:
    branches: [fix/remove-stale-tmp-files]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npx jest src/utils src/network/DefaultHarExporter.spec.ts src/Plugin.spec.ts
      - run: npm run build
      - name: e2e
        shell: bash
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 120); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          before=$(ls "$RUNNER_TEMP" "$TEMP" 2>/dev/null | grep -cE '^[0-9a-f]{16}$' || true)
          npx cypress run --browser chrome --headless --spec 'cypress/e2e/record-har.cy.ts,cypress/e2e/save-har.cy.ts'
          after=$(ls "$RUNNER_TEMP" "$TEMP" 2>/dev/null | grep -cE '^[0-9a-f]{16}$' || true)
          echo "RESULT temp files before=$before after=$after"
